name: Backend Dev Auto Deploy

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Backend Deploy
        run: |
          set -e

          echo "=== BACKEND AUTO DEPLOY ==="

          cd /srv/dev/backend

          echo "=== CURRENT BRANCH ==="
          git branch

          echo "=== FETCH LATEST ==="
          git fetch origin

          echo "=== RESET TO ORIGIN/DEV ==="
          git reset --hard origin/dev

          echo "=== BUILD & RESTART BACKEND ==="
          cd /srv/dev/compose

          docker compose up -d --build backend

          echo "=== BACKEND DEPLOY SUCCESS ==="