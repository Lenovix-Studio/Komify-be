name: Backend Dev Auto Deploy

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check Environment
        run: |
          echo "=== RUNNER ACTIVE ==="
          pwd
          ls -la /srv/dev

      - name: Deploy Backend
        run: |
          set -e

          echo "=== BACKEND DEPLOY START ==="

          cd /srv/dev/backend

          git fetch origin
          git reset --hard origin/dev

          cd /srv/dev/compose

          docker compose up -d --build backend

          echo "=== BACKEND DEPLOY DONE ==="